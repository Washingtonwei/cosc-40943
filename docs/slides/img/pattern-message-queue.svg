<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Message queue pattern in a hypothetical Project Pulse at scale</title>
<desc id="d">Not in Project Pulse today; exporting a bundle is specified but not built. A student asks for an export bundle. The API puts a job on the queue and answers 202 Accepted at once. Workers take jobs off the queue at their own pace and email the file when it is ready.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">MESSAGE QUEUE</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">hypothetical: Project Pulse at scale</text>
<g><g filter="url(#sh)"><rect x="28" y="140" width="150" height="96" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="28" y="140" width="150" height="5" rx="2.5" fill="#9B6BD6"/><text x="103.0" y="184.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Student</text><text x="103.0" y="204.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">“export bundle”</text></g><line x1="182" y1="188" x2="238" y2="188" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="242" y="140" width="160" height="96" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="242" y="140" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="322.0" y="184.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">API</text><text x="322.0" y="204.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">enqueues a job</text></g><path d="M290,236 C290,280 140,280 140,240" fill="none" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><rect x="122.83999999999999" y="278" width="184.32000000000002" height="24" rx="12" fill="#0F1420" stroke="#6FCF57" stroke-width="1.4"/><text x="215" y="295" text-anchor="middle" fill="#6FCF57" font-size="13.5" font-weight="700">202 Accepted, in 50 ms</text><line x1="406" y1="188" x2="452" y2="188" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><rect x="456" y="150" width="236" height="76" rx="38" fill="#1E273A" stroke="#FFB443" stroke-width="1.6"/><rect x="474" y="168" width="34" height="40" rx="6" fill="#2A2418" stroke="#FFB443"/><text x="491" y="194" text-anchor="middle" fill="#FFB443" font-size="12" font-weight="700">job</text><rect x="516" y="168" width="34" height="40" rx="6" fill="#2A2418" stroke="#FFB443"/><text x="533" y="194" text-anchor="middle" fill="#FFB443" font-size="12" font-weight="700">job</text><rect x="558" y="168" width="34" height="40" rx="6" fill="#2A2418" stroke="#FFB443"/><text x="575" y="194" text-anchor="middle" fill="#FFB443" font-size="12" font-weight="700">job</text><rect x="600" y="168" width="34" height="40" rx="6" fill="#2A2418" stroke="#FFB443"/><text x="617" y="194" text-anchor="middle" fill="#FFB443" font-size="12" font-weight="700">job</text><rect x="642" y="168" width="34" height="40" rx="6" fill="#2A2418" stroke="#FFB443"/><text x="659" y="194" text-anchor="middle" fill="#FFB443" font-size="12" font-weight="700">job</text><text x="574" y="128" text-anchor="middle" fill="#FFB443" font-size="13.5" font-weight="800">QUEUE: waits, in order</text><line x1="696" y1="188" x2="752" y2="150" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><line x1="696" y1="188" x2="752" y2="236" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><g><g filter="url(#sh)"><rect x="756" y="106" width="190" height="76" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="756" y="106" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="851.0" y="140.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Worker 1</text><text x="851.0" y="160.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">takes the next job</text></g><g><g filter="url(#sh)"><rect x="756" y="204" width="190" height="76" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="756" y="204" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="851.0" y="238.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Worker 2</text><text x="851.0" y="258.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">at its own pace</text></g><path d="M851,280 C851,392 40,392 40,240" fill="none" stroke="#9AA3B5" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-dim)"/><text x="560" y="350" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">bundle emailed when ready</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Sender and receiver no longer have to be busy at the same moment.</text></svg>
