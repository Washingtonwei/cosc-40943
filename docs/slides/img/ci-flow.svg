<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Continuous integration: build and test every pull request</title>
<desc id="d">A developer opens a pull request on GitHub. GitHub triggers GitHub Actions, which builds, tests, and analyzes the code on a fresh runner and reports pass or fail back on the pull request. Redrawn from the instructor's 2025 CI/CD deck.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2EDE3"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BE0E6"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
</defs>
<rect width="1000" height="400" rx="18" fill="#0F1420"/>
<text x="28" y="40" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">CONTINUOUS INTEGRATION · EVERY PULL REQUEST</text><g transform="translate(110,150)" fill="none" stroke="#F2EDE3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-34" r="11"/><path d="M-20,2 C-20,-14 -12,-20 0,-20 C12,-20 20,-14 20,2"/><rect x="-17" y="-6" width="34" height="22" rx="3"/><path d="M-6,1 l-4,4 l4,4 M6,1 l4,4 l-4,4" stroke-width="2"/><path d="M-24,16 H24"/></g><text x="110" y="196" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500">Developer</text><line x1="160" y1="140" x2="392" y2="140" stroke="#FFB443" stroke-width="3" marker-end="url(#aho)"/><text x="276" y="126" text-anchor="middle" fill="#FFD08A" font-size="17" font-weight="700">open a pull request</text><rect x="400.0" y="102.0" width="180" height="76" rx="12" fill="#1A2133" stroke="#9B6BD6" stroke-width="2.5"/><text x="490" y="136" text-anchor="middle" fill="#F2EDE3" font-size="20" font-weight="600">GitHub</text><text x="490" y="160" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500">the repository</text><text x="600" y="116" text-anchor="start" fill="#F2EDE3" font-size="16" font-weight="500">• source code</text><text x="600" y="142" text-anchor="start" fill="#F2EDE3" font-size="16" font-weight="500">• tests</text><text x="600" y="168" text-anchor="start" fill="#F2EDE3" font-size="16" font-weight="500">• workflow: build and test</text><line x1="490" y1="180" x2="490" y2="262" stroke="#F2EDE3" stroke-width="2.5" marker-end="url(#ah)"/><text x="502" y="226" text-anchor="start" fill="#9AA3B5" font-size="15" font-weight="500">triggers</text><rect x="360.0" y="270.0" width="260" height="80" rx="12" fill="#1A2133" stroke="#5BE0E6" stroke-width="2.5"/><g fill="none" stroke="#5BE0E6" stroke-width="2.2"><circle cx="384.0" cy="296" r="9"/><path d="M381.0,291 L389.0,296 L381.0,301 z" fill="#5BE0E6"/><path d="M384.0,305 V322 H395.0"/><circle cx="403.0" cy="322" r="8"/><path d="M399.0,322 l3,3 l5,-6"/></g><text x="506" y="306" text-anchor="middle" fill="#F2EDE3" font-size="18" font-weight="600">GitHub Actions</text><text x="506" y="330" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500">build, test, analyze</text><line x1="356" y1="310" x2="160" y2="310" stroke="#5BE0E6" stroke-width="3" marker-end="url(#ahc)"/><text x="268" y="296" text-anchor="middle" fill="#5BE0E6" font-size="16" font-weight="700">pass or fail</text><text x="268" y="336" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500">on the pull request</text><g transform="translate(110,310)"><circle r="22" fill="none" stroke="#7BD88F" stroke-width="3"/><path d="M-9,1 l6,6 l12,-13" fill="none" stroke="#7BD88F" stroke-width="3.5" stroke-linecap="round"/></g>
</svg>
