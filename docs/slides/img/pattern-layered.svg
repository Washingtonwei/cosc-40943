<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Layered pattern in Project Pulse</title>
<desc id="d">A request enters ActivityController, which calls ActivityService, which calls ActivityRepository, which talks to the database. Each layer calls only the one below; a controller never skips to the repository.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">LAYERED</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">Project Pulse · the activity package</text>
<rect x="150" y="62" width="690" height="262" rx="16" fill="url(#zone)" stroke="#9B6BD6" stroke-width="1.5" stroke-dasharray="7 6"/><text x="166" y="86" text-anchor="start" fill="#F2EDE3" font-size="14.5" font-weight="700">activity package: one domain, three layers inside</text><rect x="23.639999999999993" y="192" width="108.72000000000001" height="24" rx="12" fill="#0F1420" stroke="#9B6BD6" stroke-width="1.4"/><text x="78" y="209" text-anchor="middle" fill="#9B6BD6" font-size="13.5" font-weight="700">HTTP request</text><text x="273" y="112" text-anchor="middle" fill="#9B6BD6" font-size="13" font-weight="800">PRESENTATION</text><g><g filter="url(#sh)"><rect x="178" y="144" width="190" height="120" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="178" y="144" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="273.0" y="190.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Controller</text><text x="273.0" y="211.0" text-anchor="middle" fill="#C9B3EE" font-size="13.5" font-weight="500" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ActivityController</text><text x="273.0" y="230.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">receives the request</text></g><text x="495" y="112" text-anchor="middle" fill="#9B6BD6" font-size="13" font-weight="800">DOMAIN LOGIC</text><g><g filter="url(#sh)"><rect x="400" y="144" width="190" height="120" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="400" y="144" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="495.0" y="190.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Service</text><text x="495.0" y="211.0" text-anchor="middle" fill="#C9B3EE" font-size="13.5" font-weight="500" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ActivityService</text><text x="495.0" y="230.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">applies the business rules</text></g><text x="717" y="112" text-anchor="middle" fill="#9B6BD6" font-size="13" font-weight="800">DATA ACCESS</text><g><g filter="url(#sh)"><rect x="622" y="144" width="190" height="120" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="622" y="144" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="717.0" y="190.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Repository</text><text x="717.0" y="211.0" text-anchor="middle" fill="#C9B3EE" font-size="13.5" font-weight="500" font-family="'IBM Plex Mono',Consolas,Menlo,monospace">ActivityRepository</text><text x="717.0" y="230.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">talks to the database</text></g><line x1="118" y1="204" x2="174" y2="204" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="368" y1="204" x2="396" y2="204" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="590" y1="204" x2="618" y2="204" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="812" y1="204" x2="866" y2="204" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><text x="382" y="196" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500"></text><g><path d="M870,164 v82 a53.0,14 0 0 0 106,0 v-82" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.4"/><ellipse cx="923.0" cy="164" rx="53.0" ry="14" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.4"/><text x="923.0" y="217.0" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Database</text></g><path d="M273,264 C273,318 717,318 717,268" fill="none" stroke="#FF4D4D" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-alarm)"/><circle cx="495" cy="305" r="13" fill="#0F1420" stroke="#FF4D4D" stroke-width="2"/><path d="M490,300 l10,10 M500,300 l-10,10" stroke="#FF4D4D" stroke-width="2.4"/><text x="495" y="348" text-anchor="middle" fill="#FF4D4D" font-size="14.5" font-weight="700">a controller never skips to the repository</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Each layer knows only the one below it.</text></svg>
