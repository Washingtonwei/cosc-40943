<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">The activity package as one slice of a layer cake</title>
<desc id="d">Project Pulse's backend drawn as a layer cake. The layers (web, business logic, data access) run across every package, and the whole cake sits on one shared database. The activity package is a slice pulled out of the cake: ActivityController with its converters and DTOs in the web layer, ActivityService and ActivitySecurityService in business logic, ActivityRepository and the Activity entity in data access. The rest of the cake is the evaluation, team, and rubric packages and more.</desc>
<defs>
  <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/></filter>
</defs>
<rect width="1000" height="500" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">LAYER CAKE</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">Project Pulse · packaged by domain</text>

<!-- the plate: one database under every package -->
<rect x="20" y="402" width="965" height="42" rx="21" fill="url(#cyl)" stroke="#4A5878" stroke-width="1.5"/>
<text x="640" y="433" text-anchor="middle" fill="#F2EDE3" font-size="14" font-weight="700" letter-spacing="1">DATABASE, SHARED BY EVERY PACKAGE</text>

<!-- the rest of the cake: front bands -->
<g stroke="#0F1420" stroke-width="1.5">
  <rect x="330" y="170" width="600" height="80" fill="#9B6BD6" fill-opacity="0.45"/>
  <rect x="330" y="250" width="600" height="80" fill="#FFB443" fill-opacity="0.40"/>
  <rect x="330" y="330" width="600" height="80" fill="#6FCF57" fill-opacity="0.38"/>
  <!-- right side face -->
  <polygon points="930,170 980,120 980,200 930,250" fill="#9B6BD6" fill-opacity="0.28"/>
  <polygon points="930,250 980,200 980,280 930,330" fill="#FFB443" fill-opacity="0.25"/>
  <polygon points="930,330 980,280 980,360 930,410" fill="#6FCF57" fill-opacity="0.22"/>
  <!-- frosting on top -->
  <polygon points="330,170 930,170 980,120 380,120" fill="#F2EDE3" fill-opacity="0.92"/>
</g>
<!-- where the slices are cut -->
<g stroke="#0F1420" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.8">
  <polyline points="530,120 480,170 480,410" fill="none"/>
  <polyline points="680,120 630,170 630,410" fill="none"/>
  <polyline points="830,120 780,170 780,410" fill="none"/>
</g>
<g fill="#0F1420" font-size="14" font-weight="700" text-anchor="middle">
  <text x="430" y="150">evaluation</text>
  <text x="580" y="150">team</text>
  <text x="730" y="150">rubric</text>
  <text x="880" y="150">…</text>
</g>
<g fill="#F2EDE3" fill-opacity="0.9" font-size="13.5" font-weight="800" letter-spacing="1.5" text-anchor="middle">
  <text x="630" y="215">WEB: THE HTTP ENDPOINTS</text>
  <text x="630" y="295">BUSINESS LOGIC</text>
  <text x="630" y="375">DATA ACCESS</text>
</g>

<!-- the slice: the activity package -->
<g filter="url(#sh)">
  <g stroke="#0F1420" stroke-width="1.5">
    <rect x="40" y="170" width="210" height="80" fill="#9B6BD6" fill-opacity="0.55"/>
    <rect x="40" y="250" width="210" height="80" fill="#FFB443" fill-opacity="0.50"/>
    <rect x="40" y="330" width="210" height="80" fill="#6FCF57" fill-opacity="0.48"/>
    <polygon points="250,170 300,120 300,200 250,250" fill="#9B6BD6" fill-opacity="0.32"/>
    <polygon points="250,250 300,200 300,280 250,330" fill="#FFB443" fill-opacity="0.30"/>
    <polygon points="250,330 300,280 300,360 250,410" fill="#6FCF57" fill-opacity="0.27"/>
    <polygon points="40,170 250,170 300,120 90,120" fill="#F2EDE3"/>
  </g>
  <polygon points="40,170 90,120 300,120 300,360 250,410 40,410" fill="none" stroke="#FFB443" stroke-width="3" stroke-linejoin="round"/>
  <line x1="40" y1="170" x2="250" y2="170" stroke="#FFB443" stroke-width="1.5"/>
  <line x1="250" y1="170" x2="250" y2="410" stroke="#FFB443" stroke-width="1.5"/>
  <line x1="250" y1="170" x2="300" y2="120" stroke="#FFB443" stroke-width="1.5"/>
</g>
<text x="170" y="150" text-anchor="middle" fill="#0F1420" font-size="15" font-weight="800">activity</text>
<g text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="700">
  <text x="145" y="205">ActivityController</text>
  <text x="145" y="227" font-weight="500" fill-opacity="0.8">converters, DTOs</text>
  <text x="145" y="285">ActivityService</text>
  <text x="145" y="307">ActivitySecurityService</text>
  <text x="145" y="365">ActivityRepository</text>
  <text x="145" y="387" font-weight="500" fill-opacity="0.8">Activity (the entity)</text>
</g>

<text x="500" y="476" text-anchor="middle" fill="#9AA3B5" font-size="14">A change to how weekly activity reports work stays inside one slice.</text>
</svg>
