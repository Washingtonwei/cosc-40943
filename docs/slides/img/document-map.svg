<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">The documents so far, and where the design-of-record sits</title><desc id="d">Left to right. Requirements from weeks 3 and 4: vision and scope, glossary, use cases, business rules, and the specification. They drive one architecture-of-record for the whole system, from week 6. Inside that map, each use case area gets its own design-of-record in week 7, such as Project Pulse's not.md for reminders; the use cases feed the designs directly. The design leads to code in week 8 and tests in week 9.</desc>
