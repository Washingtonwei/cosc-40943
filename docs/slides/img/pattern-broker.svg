10.0.1.8 · replaced copy 1</text></g><g><g filter="url(#sh)"><rect x="700" y="270" width="250" height="72" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="700" y="270" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="825.0" y="302.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">email service, copy 1</text><text x="825.0" y="322.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">10.0.2.3</text></g><line x1="604" y1="206" x2="696" y2="206" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><text x="650" y="196" text-anchor="middle" fill="#6FCF57" font-size="13.5" font-weight="600">forwards</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Clients know the broker, never the addresses.</text></svg>
