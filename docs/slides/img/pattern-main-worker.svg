<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Main-worker pattern in a hypothetical Project Pulse at scale</title>
<desc id="d">Not in Project Pulse today, where one scheduler loops over every course section. A main process splits Monday's reminders for 6,000 course sections into four chunks, sends one to each identical worker, and collects the four counts.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">MAIN-WORKER</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">hypothetical: Project Pulse at scale</text>
<g><g filter="url(#sh)"><rect x="28" y="150" width="160" height="100" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="28" y="150" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="108.0" y="196.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Monday 9:00</text><text x="108.0" y="216.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">6,000 sections</text></g><line x1="192" y1="200" x2="236" y2="200" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="240" y="130" width="160" height="140" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="240" y="130" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="320.0" y="186.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Main</text><text x="320.0" y="206.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">splits, then</text><text x="320.0" y="226.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">collects</text></g><line x1="404" y1="200" x2="516" y2="94" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><rect x="440" y="74" width="0" height="0"/><g><g filter="url(#sh)"><rect x="520" y="64" width="190" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="520" y="64" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="615.0" y="90.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Worker 1</text><text x="615.0" y="110.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">sections 1–1,500</text></g><path d="M714,94 C780,94 790,200 846,200" fill="none" stroke="#6FCF57" stroke-width="1.8" marker-end="url(#m-ok)"/><line x1="404" y1="200" x2="516" y2="172" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><rect x="440" y="152" width="0" height="0"/><g><g filter="url(#sh)"><rect x="520" y="142" width="190" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="520" y="142" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="615.0" y="168.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Worker 2</text><text x="615.0" y="188.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">sections 1,501–3,000</text></g><path d="M714,172 C780,172 790,200 846,200" fill="none" stroke="#6FCF57" stroke-width="1.8" marker-end="url(#m-ok)"/><line x1="404" y1="200" x2="516" y2="250" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><rect x="440" y="230" width="0" height="0"/><g><g filter="url(#sh)"><rect x="520" y="220" width="190" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="520" y="220" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="615.0" y="246.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Worker 3</text><text x="615.0" y="266.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">sections 3,001–4,500</text></g><path d="M714,250 C780,250 790,200 846,200" fill="none" stroke="#6FCF57" stroke-width="1.8" marker-end="url(#m-ok)"/><line x1="404" y1="200" x2="516" y2="328" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><rect x="440" y="308" width="0" height="0"/><g><g filter="url(#sh)"><rect x="520" y="298" width="190" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="520" y="298" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="615.0" y="324.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Worker 4</text><text x="615.0" y="344.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">sections 4,501–6,000</text></g><path d="M714,328 C780,328 790,200 846,200" fill="none" stroke="#6FCF57" stroke-width="1.8" marker-end="url(#m-ok)"/><g><g filter="url(#sh)"><rect x="850" y="150" width="126" height="100" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="850" y="150" width="126" height="5" rx="2.5" fill="#9B6BD6"/><text x="913.0" y="196.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Counts</text><text x="913.0" y="216.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">150,000 sent</text></g><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Split one big job into identical pieces, run them in parallel, combine. Exactly one main runs.</text></svg>
