<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Project Pulse's observability stack: complete on a laptop, absent in production</title>
<desc id="d">On a developer's laptop, docker-compose runs Prometheus, Grafana, Zipkin, Mailpit, and MySQL beside the Spring Boot app. Prometheus scrapes /actuator/prometheus every 15 seconds and Grafana draws dashboards from it; a footnote says the scrape needs an admin token pasted into prometheus.yml, because the endpoint is admin only. Traces, 10 percent sampled, go to Zipkin; mail goes to Mailpit. In production on Azure, the app and Azure Database run with no collector at all; only the health and info endpoints are public. That gap is TD-prod-observability. Redrawn from the instructor's 2025 Web Tech deck, updated to Project Pulse at 75340e1.</desc>
