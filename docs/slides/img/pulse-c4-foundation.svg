<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 870" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Component Diagram: shared foundation inside the REST API Application</title>
<desc id="d">The REST API application's shared foundation: security, SPA serving, actuator, user, the org model, participants, rubric, and notifications, with the SPA, the database, and Gmail outside. Redrawn from the mermaid C4 in Project Pulse's architecture-of-record.</desc>
<defs>
