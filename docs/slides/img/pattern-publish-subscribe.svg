<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Publish-subscribe pattern in a hypothetical Project Pulse at scale</title>
<desc id="d">Not in Project Pulse today, where evaluation calls the email service directly. The evaluation service publishes a PeerEvaluationSubmitted event to a channel. Email, grade, and audit subscribers each receive it independently; a new analytics subscriber can be added later without changing the publisher.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">PUBLISH-SUBSCRIBE</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">hypothetical: Project Pulse at scale</text>
<g><g filter="url(#sh)"><rect x="30" y="150" width="200" height="110" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="30" y="150" width="200" height="5" rx="2.5" fill="#9B6BD6"/><text x="130.0" y="201.0" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Evaluation service</text><text x="130.0" y="221.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">the publisher</text></g><line x1="234" y1="205" x2="300" y2="205" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><rect x="300.5" y="164" width="179.00000000000003" height="24" rx="12" fill="#0F1420" stroke="#FFB443" stroke-width="1.4"/><text x="390" y="181" text-anchor="middle" fill="#FFB443" font-size="12.5" font-weight="700">PeerEvaluationSubmitted</text><text x="390" y="238" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">the event, fired once</text><rect x="496" y="70" width="36" height="300" rx="10" fill="#1E273A" stroke="#FFB443" stroke-width="1.6"/><line x1="480" y1="205" x2="492" y2="205" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><text x="514" y="220" text-anchor="middle" fill="#FFB443" font-size="14" font-weight="800" transform="rotate(-90 514 220)" letter-spacing="2">CHANNEL</text><line x1="536" y1="98" x2="626" y2="98" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><g><g filter="url(#sh)"><rect x="630" y="66" width="250" height="64" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="630" y="66" width="250" height="5" rx="2.5" fill="#FFB443"/><text x="755.0" y="94.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Email notifier</text><text x="755.0" y="114.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">confirms to the student</text></g><line x1="536" y1="176" x2="626" y2="176" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><g><g filter="url(#sh)"><rect x="630" y="144" width="250" height="64" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="630" y="144" width="250" height="5" rx="2.5" fill="#FFB443"/><text x="755.0" y="172.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Grade calculator</text><text x="755.0" y="192.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">updates the average</text></g><line x1="536" y1="254" x2="626" y2="254" stroke="#FFB443" stroke-width="2.2" marker-end="url(#m-amber)"/><g><g filter="url(#sh)"><rect x="630" y="222" width="250" height="64" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="630" y="222" width="250" height="5" rx="2.5" fill="#FFB443"/><text x="755.0" y="250.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Audit log</text><text x="755.0" y="270.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">records who did what</text></g><line x1="536" y1="332" x2="626" y2="332" stroke="#FFB443" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-amber)"/><g><g filter="url(#sh)"><rect x="630" y="300" width="250" height="64" rx="12" fill="#171E2E" stroke="#2C374E" stroke-dasharray="6 5"/></g><rect x="630" y="300" width="250" height="5" rx="2.5" fill="#5C6780"/><text x="755.0" y="328.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Analytics</text><text x="755.0" y="348.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">added next year</text></g><text x="940" y="336" text-anchor="middle" fill="#9AA3B5" font-size="13.5" font-weight="600">no change to</text><text x="940" y="354" text-anchor="middle" fill="#9AA3B5" font-size="13.5" font-weight="600">the publisher</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">The publisher does not know who is listening.</text></svg>
