<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Pipes and filters: the Spring Security filter chain</title>
<desc id="d">An HTTP request passes through CORS, authentication, and authorization filters in order before it reaches the controller. Each filter can pass the request on or reject it. A second strip shows a machine learning pipeline, the same pattern on data.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">PIPES AND FILTERS</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">Spring Security in Project Pulse</text>
<rect x="10.999999999999993" y="138" width="102.00000000000001" height="24" rx="12" fill="#0F1420" stroke="#9B6BD6" stroke-width="1.4"/><text x="62" y="155" text-anchor="middle" fill="#9B6BD6" font-size="12.5" font-weight="700">HTTP request</text><line x1="112" y1="150" x2="146" y2="150" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g filter="url(#sh)"><path d="M150,100 h146 l-18,50 l18,50 h-146 l18,-50 z" fill="#171E2E" stroke="#2C374E"/></g><path d="M150,100 h146" stroke="#9B6BD6" stroke-width="5"/><text x="225.0" y="148" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">CORS</text><text x="225.0" y="170" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">right origin?</text><line x1="223.0" y1="206" x2="223.0" y2="244" stroke="#FF4D4D" stroke-width="2.2" marker-end="url(#m-alarm)"/><rect x="187.54" y="250" width="70.92" height="24" rx="12" fill="#0F1420" stroke="#FF4D4D" stroke-width="1.4"/><text x="223.0" y="267" text-anchor="middle" fill="#FF4D4D" font-size="13.5" font-weight="700">blocked</text><g filter="url(#sh)"><path d="M308,100 h146 l-18,50 l18,50 h-146 l18,-50 z" fill="#171E2E" stroke="#2C374E"/></g><path d="M308,100 h146" stroke="#9B6BD6" stroke-width="5"/><text x="383.0" y="148" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Authentication</text><text x="383.0" y="170" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">who are you?</text><line x1="381.0" y1="206" x2="381.0" y2="244" stroke="#FF4D4D" stroke-width="2.2" marker-end="url(#m-alarm)"/><rect x="360.65999999999997" y="250" width="40.68000000000001" height="24" rx="12" fill="#0F1420" stroke="#FF4D4D" stroke-width="1.4"/><text x="381.0" y="267" text-anchor="middle" fill="#FF4D4D" font-size="13.5" font-weight="700">401</text><g filter="url(#sh)"><path d="M466,100 h146 l-18,50 l18,50 h-146 l18,-50 z" fill="#171E2E" stroke="#2C374E"/></g><path d="M466,100 h146" stroke="#9B6BD6" stroke-width="5"/><text x="541.0" y="148" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Authorization</text><text x="541.0" y="170" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">may you?</text><line x1="539.0" y1="206" x2="539.0" y2="244" stroke="#FF4D4D" stroke-width="2.2" marker-end="url(#m-alarm)"/><rect x="518.66" y="250" width="40.68000000000001" height="24" rx="12" fill="#0F1420" stroke="#FF4D4D" stroke-width="1.4"/><text x="539.0" y="267" text-anchor="middle" fill="#FF4D4D" font-size="13.5" font-weight="700">403</text><g filter="url(#sh)"><path d="M624,100 h146 l-18,50 l18,50 h-146 l18,-50 z" fill="#171E2E" stroke="#2C374E"/></g><path d="M624,100 h146" stroke="#9B6BD6" stroke-width="5"/><text x="699.0" y="148" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">… more filters</text><line x1="774" y1="150" x2="816" y2="150" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><g><g filter="url(#sh)"><rect x="820" y="102" width="150" height="96" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="820" y="102" width="150" height="5" rx="2.5" fill="#9B6BD6"/><text x="895.0" y="146.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Controller</text><text x="895.0" y="166.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">your code</text></g><text x="540.0" y="86" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">every request, in this order</text><text x="890" y="232" text-anchor="middle" fill="#FFB443" font-size="14.5" font-weight="700">No rule matched?</text><text x="890" y="252" text-anchor="middle" fill="#FFB443" font-size="14.5" font-weight="700">the last rule decides</text><text x="890" y="272" text-anchor="middle" fill="#FFB443" font-size="13.5" font-weight="500">(section 4.9)</text><line x1="28" y1="306" x2="972" y2="306" stroke="#2C374E"/><text x="28" y="334" text-anchor="start" fill="#5C6780" font-size="12.5" font-weight="800">SAME PATTERN ON DATA</text><rect x="230" y="318" width="98.8" height="32" rx="8" fill="#1E273A" stroke="#2C374E"/><text x="279.4" y="339" text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="500">raw data</text><line x1="332.8" y1="334" x2="358.8" y2="334" stroke="#9AA3B5" stroke-width="1.8" marker-end="url(#m-dim)"/><rect x="362.8" y="318" width="73.0" height="32" rx="8" fill="#1E273A" stroke="#2C374E"/><text x="399.3" y="339" text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="500">clean</text><line x1="439.8" y1="334" x2="465.8" y2="334" stroke="#9AA3B5" stroke-width="1.8" marker-end="url(#m-dim)"/><rect x="469.8" y="318" width="167.6" height="32" rx="8" fill="#1E273A" stroke="#2C374E"/><text x="553.6" y="339" text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="500">extract features</text><line x1="641.4" y1="334" x2="667.4" y2="334" stroke="#9AA3B5" stroke-width="1.8" marker-end="url(#m-dim)"/><rect x="671.4" y="318" width="73.0" height="32" rx="8" fill="#1E273A" stroke="#2C374E"/><text x="707.9" y="339" text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="500">train</text><line x1="748.4" y1="334" x2="774.4" y2="334" stroke="#9AA3B5" stroke-width="1.8" marker-end="url(#m-dim)"/><rect x="778.4" y="318" width="98.8" height="32" rx="8" fill="#1E273A" stroke="#2C374E"/><text x="827.8" y="339" text-anchor="middle" fill="#F2EDE3" font-size="14.5" font-weight="500">evaluate</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Each filter takes input, does one job, and passes it on or stops it.</text></svg>
