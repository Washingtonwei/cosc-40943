-anchor="start" fill="#9AA3B5" font-size="12" font-weight="500">in; passes authorized</text><text x="605.0" y="402.5" text-anchor="start" fill="#9AA3B5" font-size="12" font-weight="500">requests to</text><path d="M750,442.0 L790,442.0 L790,309.0 L820,309.0" fill="none" stroke="#9B6BD6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#req)"/><rect x="849.15" y="357.5" width="131.7" height="51" rx="6" fill="#0F1420" fill-opacity="0.92"/><text x="915" y="372.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">Scores peer</text><text x="915" y="387.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">evaluations against</text><text x="915" y="402.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">criteria from</text><path d="M750,502.5 L820,502.5" fill="none" stroke="#9B6BD6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#req)"/><rect x="741.2" y="549.5" width="87.6" height="51" rx="6" fill="#0F1420" fill-opacity="0.92"/><text x="785" y="564.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">Sends</text><text x="785" y="579.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">confirmation</text><text x="785" y="594.5" text-anchor="middle" fill="#9AA3B5" font-size="12" font-weight="500">email via</text><path d="M262.0,530 L262.0,625.0 L260,625.0" fill="none" stroke="#9B6BD6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#req)"/><rect x="122.0" y="544.0" width="138.0" height="36" rx="6" fill="#0F1420" fill-opacity="0.92"/><text x="254.0" y="559.0" text-anchor="end" fill="#9AA3B5" font-size="12" font-weight="500">Reads team members</text><text x="254.0" y="574.0" text-anchor="end" fill="#9AA3B5" font-size="12" font-weight="500">and instructors from</text><path d="M554.0,530 L554.0,625.0 L590,625.0" fill="none" stroke="#9B6BD6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#req)"/><rect x="556.0" y="542.0" width="144.299999999