<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 790" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Component Diagram: performance-tracking components inside the REST API Application</title>
<desc id="d">The performance-tracking feature area, activity and evaluation, on the shared foundation (security, the org model, rubric, notifications, drawn in grey), with the SPA and the database outside. Redrawn from the mermaid C4 in Project Pulse's architecture-of-record.</desc>
<defs>
