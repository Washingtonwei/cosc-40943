 and RAM</text><text x="502.5" y="575.8" text-anchor="middle" fill="#C9CED8" font-size="12" font-weight="500">artifacts, links, and</text><text x="502.5" y="591.8" text-anchor="middle" fill="#C9CED8" font-size="12" font-weight="500">documents</text><path d="M630,472.4 v110.2 a102.5,17.4 0 0 0 205,0 v-110.2" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.3"/><ellipse cx="732.5" cy="472.4" rx="102.5" ry="17.4" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.3"/><text x="732.5" y="509.8" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Blob Storage</text><text x="732.5" y="527.8" text-anchor="middle" fill="#9AA3B5" font-size="11.5" font-weight="500" font-style="italic">[Container: Azure Blob Storage]</text><text x="732.5" y="543.8" text-anchor="middle" fill="#C9CED8" font-size="12" font-weight="500">Uploaded project source</text><text x="732.5" y="559.8" text-anchor="middle" fill="#C9CED8" font-size="12" font-weight="500">material (PDF/PPTX)</text><line x1="24" y1="646" x2="1176" y2="646" stroke="#2C374E"/><circle cx="49" cy="657" r="7" fill="none" stroke="#9B6BD6" stroke-width="2"/><path d="M38,680 a11,12 0 0 1 22,0" fill="none" stroke="#9B6BD6" stroke-width="2"/><text x="76" y="668" text-anchor="start" fill="#9AA3B5" font-size="13" font-weight="500">person</text><rect x="146.2" y="653" width="34" height="22" rx="5" fill="#171E2E" stroke="#2C374E"/><rect x="146.2" y="653" width="34" height="4" rx="2" fill="#9B6BD6"/><text x="190.2" y="668" text-anchor="start" fill="#9AA3B5" font-size="13" font-weight="500">container</text><path d="M286.5,654.64 v18.72 a11.0,3.6400000000000006 0 0 0 22,0 v-18.72" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.3"/><ellipse cx="297.5" cy="654.64" rx="11.0" ry="3.6400000000000006" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.3"/><text x="297.5" y="669.82" text-anchor="middle" fill="#F2EDE3" font-size="12" font-weight="600"></text><text x="324.5" y="668" text-anchor="start" fill="#9AA3B5" font-size="13" font-we