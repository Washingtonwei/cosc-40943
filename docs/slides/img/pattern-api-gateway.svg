<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">API gateway pattern in a hypothetical Project Pulse at scale</title>
<desc id="d">Not in Project Pulse today. The browser, the mobile app, and university learning management systems all call one gateway, which authenticates, rate-limits, logs, and routes each request to one of several services.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">API GATEWAY</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">hypothetical: Project Pulse at scale</text>
<g><g filter="url(#sh)"><rect x="30" y="84" width="160" height="72" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="30" y="84" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="110.0" y="126.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Browser</text></g><line x1="194" y1="120" x2="316" y2="190" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="30" y="180" width="160" height="72" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="30" y="180" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="110.0" y="222.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Mobile app</text></g><line x1="194" y1="216" x2="316" y2="214" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="30" y="276" width="160" height="72" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="30" y="276" width="160" height="5" rx="2.5" fill="#9B6BD6"/><text x="110.0" y="318.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">University LMS</text></g><line x1="194" y1="312" x2="316" y2="238" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="320" y="70" width="250" height="290" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="320" y="70" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="445.0" y="106" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">API gateway</text></g><rect x="352" y="180" width="186" height="32" rx="16" fill="#1E273A" stroke="#9B6BD6"/><text x="445" y="201" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="500">authenticate</text><rect x="352" y="222" width="186" height="32" rx="16" fill="#1E273A" stroke="#9B6BD6"/><text x="445" y="243" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="500">rate-limit</text><rect x="352" y="264" width="186" height="32" rx="16" fill="#1E273A" stroke="#9B6BD6"/><text x="445" y="285" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="500">log</text><rect x="352" y="306" width="186" height="32" rx="16" fill="#1E273A" stroke="#9B6BD6"/><text x="445" y="327" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="500">route</text><text x="445" y="146" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">one entry point</text><line x1="574" y1="214" x2="716" y2="96" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="720" y="66" width="250" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="720" y="66" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="845.0" y="102.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Activity service</text></g><line x1="574" y1="214" x2="716" y2="174" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="720" y="144" width="250" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="720" y="144" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="845.0" y="180.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Evaluation service</text></g><line x1="574" y1="214" x2="716" y2="252" stroke="#9B6BD6" stroke-width="1.8" marker-end="url(#m-acc)"/><g><g filter="url(#sh)"><rect x="720" y="222" width="250" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="720" y="222" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="845.0" y="258.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">Team service</text></g><line x1="574" y1="214" x2="716" y2="330" stroke="#9B6BD6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#m-acc)"/><g opacity="0.45"><g filter="url(#sh)"><rect x="720" y="300" width="250" height="60" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="720" y="300" width="250" height="5" rx="2.5" fill="#9B6BD6"/><text x="845.0" y="336.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">… four more</text></g><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Cross-cutting concerns in one place, so each service does not reinvent them.</text></svg>
