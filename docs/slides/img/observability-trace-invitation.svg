<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="1000" height="604" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">One invitation request in Project Pulse, as two traces</title>
<desc id="d">Two real traces of the same request, an instructor inviting two students, captured in Zipkin on Project Pulse dev on 2026-11-08. Top, as Project Pulse ships: a 174.8 ms HTTP span; Spring Security's spans for the bearer token and the authorization rule; and one 164.9 ms secured request span with nothing inside it, although the database work and two emails happen there. Bottom, with @Observed on EmailService.sendInvitationEmail: the same shape, 207.1 ms in all, and inside the secured request two send invitation email spans of 105.1 ms and 15.4 ms, after about 50 ms with no span, which is the database work.</desc>
