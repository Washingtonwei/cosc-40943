<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Monitoring is the dashboard; observability is the diagnostic port</title>
<desc id="d">On the left, a car dashboard with a temperature gauge in the red and a warning light: it answers the questions designed in advance, such as whether the engine is hot. On the right, a scanner plugged into the car's diagnostic port reads out why: the cooling fan relay failed. It answers a question nobody planned, without taking the engine apart. The car analogy is from the instructor's 2025 Web Tech deck.</desc>
<rect width="1000" height="360" rx="18" fill="#0F1420"/>
<text x="28" y="36" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">MONITORING AND OBSERVABILITY</text>
<text x="972" y="36" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">the analogy from the 2025 Web Tech deck</text>
<!-- dashboard -->
<rect x="60" y="74" width="400" height="180" rx="22" fill="#161D2C" stroke="#2A3347" stroke-width="2"/>
<!-- temp gauge -->
<path d="M110,206 A80,80 0 0,1 270,206" fill="none" stroke="#2A3347" stroke-width="12"/>
<path d="M240,150 A80,80 0 0,1 270,206" fill="none" stroke="#FF4D4D" stroke-width="12"/>
<line x1="190" y1="206" x2="254" y2="164" stroke="#F2EDE3" stroke-width="4" stroke-linecap="round"/>
<circle cx="190" cy="206" r="8" fill="#F2EDE3"/>
<text x="190" y="238" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="700">TEMP</text>
<!-- fuel gauge -->
<path d="M300,206 A60,60 0 0,1 420,206" fill="none" stroke="#2A3347" stroke-width="10"/>
<line x1="360" y1="206" x2="320" y2="168" stroke="#F2EDE3" stroke-width="4" stroke-linecap="round"/>
<circle cx="360" cy="206" r="7" fill="#F2EDE3"/>
<text x="360" y="238" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="700">FUEL</text>
<!-- warning light -->
<path d="M360,96 L384,136 L336,136 Z" fill="none" stroke="#FFB443" stroke-width="3" stroke-linejoin="round"/>
<text x="360" y="131" text-anchor="middle" fill="#FFB443" font-size="20" font-weight="800">!</text>
<text x="260" y="292" text-anchor="middle" fill="#F2EDE3" font-size="20" font-weight="700">Monitoring: the dashboard</text>
<text x="260" y="318" text-anchor="middle" fill="#9AA3B5" font-size="16">"Is the engine hot?" A question you planned.</text>
<!-- port and scanner -->
<rect x="560" y="140" width="110" height="60" rx="10" fill="#161D2C" stroke="#2A3347" stroke-width="2"/>
<g fill="#9AA3B5"><circle cx="584" cy="160" r="4"/><circle cx="602" cy="160" r="4"/><circle cx="620" cy="160" r="4"/><circle cx="638" cy="160" r="4"/><circle cx="593" cy="180" r="4"/><circle cx="611" cy="180" r="4"/><circle cx="629" cy="180" r="4"/><circle cx="647" cy="180" r="4"/></g>
<text x="615" y="224" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="700">diagnostic port</text>
<path d="M670,170 C710,170 700,130 740,130" fill="none" stroke="#5BE0E6" stroke-width="4"/>
<rect x="740" y="78" width="200" height="170" rx="16" fill="#1B2335" stroke="#5BE0E6" stroke-width="2"/>
<rect x="758" y="96" width="164" height="90" rx="8" fill="#0F1420" stroke="#2A3347" stroke-width="1.5"/>
<text x="840" y="124" text-anchor="middle" fill="#5BE0E6" font-size="15" font-weight="700">cooling fan relay</text>
<text x="840" y="146" text-anchor="middle" fill="#5BE0E6" font-size="15" font-weight="700">failed at 9:02</text>
<text x="840" y="170" text-anchor="middle" fill="#9AA3B5" font-size="13">fan off since start</text>
<circle cx="800" cy="216" r="12" fill="#2A3347"/><circle cx="840" cy="216" r="12" fill="#2A3347"/><circle cx="880" cy="216" r="12" fill="#2A3347"/>
<text x="750" y="292" text-anchor="middle" fill="#F2EDE3" font-size="20" font-weight="700">Observability: the port</text>
<text x="750" y="318" text-anchor="middle" fill="#9AA3B5" font-size="16">"Why?" Answered without opening the engine.</text>
</svg>
