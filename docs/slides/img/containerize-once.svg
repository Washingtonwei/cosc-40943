iddle" fill="#9AA3B5" font-size="13" font-weight="500">container</text><rect x="868" y="152" width="68" height="80" rx="8" fill="none" stroke="#9AA3B5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="902" y="188" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500">other</text><text x="902" y="204" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500">container</text><path d="M262,128 C390,52 610,52 738,128" fill="none" stroke="#5BE0E6" stroke-width="3" marker-end="url(#ahc)"/><text x="500" y="50" text-anchor="middle" fill="#5BE0E6" font-size="17" font-weight="700">the same image</text><text x="500" y="396" text-anchor="middle" fill="#9AA3B5" font-size="16" font-weight="500">Image: the template, like a class. Container: a running instance, like an object.</text>
