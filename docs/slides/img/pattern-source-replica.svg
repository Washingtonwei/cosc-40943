<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Source-replica pattern in a hypothetical Project Pulse at scale</title>
<desc id="d">Not in Project Pulse today, which has one MySQL server. In grading week, Project Pulse sends every write to the source database and spreads reads across two replicas, which copy the source's changes. If the source fails, a replica is promoted.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">SOURCE-REPLICA</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">hypothetical: Project Pulse at scale</text>
<g><g filter="url(#sh)"><rect x="30" y="150" width="180" height="110" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="30" y="150" width="180" height="5" rx="2.5" fill="#9B6BD6"/><text x="120.0" y="201.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Project Pulse</text><text x="120.0" y="221.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">grading week</text></g><g><path d="M330,159 v92 a85.0,14 0 0 0 170,0 v-92" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.4"/><ellipse cx="415.0" cy="159" rx="85.0" ry="14" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.4"/><text x="415.0" y="208.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Source</text><text x="415.0" y="230.4" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500" font-style="italic">every write</text></g><g><path d="M640,76 v76 a80.0,14 0 0 0 160,0 v-76" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.4"/><ellipse cx="720.0" cy="76" rx="80.0" ry="14" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.4"/><text x="720.0" y="117.0" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Replica 1</text><text x="720.0" y="138.2" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500" font-style="italic">reads</text></g><g><path d="M640,264 v76 a80.0,14 0 0 0 160,0 v-76" fill="url(#cyl)" stroke="#9AA3B5" stroke-width="1.4"/><ellipse cx="720.0" cy="264" rx="80.0" ry="14" fill="#3B4A69" stroke="#9AA3B5" stroke-width="1.4"/><text x="720.0" y="305.0" text-anchor="middle" fill="#F2EDE3" font-size="16" font-weight="700">Replica 2</text><text x="720.0" y="326.2" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500" font-style="italic">reads</text></g><line x1="214" y1="205" x2="324" y2="205" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><rect x="220.5" y="174" width="95.00000000000001" height="24" rx="12" fill="#0F1420" stroke="#9B6BD6" stroke-width="1.4"/><text x="268" y="191" text-anchor="middle" fill="#9B6BD6" font-size="12.5" font-weight="700">writes · 5%</text><path d="M120,150 C120,70 400,60 634,100" fill="none" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><path d="M120,260 C120,350 400,350 634,306" fill="none" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><rect x="241.62" y="60" width="176.76000000000002" height="24" rx="12" fill="#0F1420" stroke="#6FCF57" stroke-width="1.4"/><text x="330" y="77" text-anchor="middle" fill="#6FCF57" font-size="13.5" font-weight="700">dashboard reads · 95%</text><path d="M504,190 C560,180 590,130 634,122" fill="none" stroke="#FFB443" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-amber)"/><path d="M504,220 C560,230 590,280 634,288" fill="none" stroke="#FFB443" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-amber)"/><text x="566" y="212" text-anchor="middle" fill="#FFB443" font-size="14" font-weight="700">copies</text><g><g filter="url(#sh)"><rect x="830" y="150" width="150" height="110" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="830" y="150" width="150" height="5" rx="2.5" fill="#FF4D4D"/><text x="905.0" y="191.0" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">If Source fails</text><text x="905.0" y="211.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">promote a</text><text x="905.0" y="231.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">replica</text></g><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Scale the reads and survive a failure; every write still goes to one place.</text></svg>
