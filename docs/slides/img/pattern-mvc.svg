<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Model-view-controller in the browser and on the server</title>
<desc id="d">In a Vue component, a user event reaches a handler (controller), which updates reactive state (model), which re-renders the template (view). On the server, a Spring controller receives the request, the service and entity are the model, and the JSON response is the view.</desc>
<defs>
  <marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B6BD6"/></marker>
  <marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6FCF57"/></marker>
  <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
  <marker id="m-alarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
  <marker id="m-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3B5"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/></filter>
  <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B6BD6" stop-opacity="0.10"/><stop offset="1" stop-color="#9B6BD6" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#26324A"/><stop offset="0.5" stop-color="#34425F"/><stop offset="1" stop-color="#26324A"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="18" fill="#0F1420"/>
<text x="28" y="38" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">MODEL-VIEW-CONTROLLER</text>
<text x="972" y="38" text-anchor="end" fill="#FFB443" font-size="14" font-weight="700">the same idea on both sides</text>
<rect x="24" y="58" width="456" height="312" rx="16" fill="url(#zone)" stroke="#9B6BD6" stroke-width="1.5" stroke-dasharray="7 6"/><text x="40" y="82" text-anchor="start" fill="#F2EDE3" font-size="14.5" font-weight="700">In the browser: a Vue component</text><g><g filter="url(#sh)"><rect x="152" y="102" width="200" height="76" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="152" y="102" width="200" height="5" rx="2.5" fill="#9B6BD6"/><text x="252.0" y="136.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Model</text><text x="252.0" y="156.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">reactive state</text></g><g><g filter="url(#sh)"><rect x="44" y="262" width="190" height="84" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="44" y="262" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="139.0" y="300.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">View</text><text x="139.0" y="320.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">the template</text></g><g><g filter="url(#sh)"><rect x="270" y="262" width="190" height="84" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="270" y="262" width="190" height="5" rx="2.5" fill="#9B6BD6"/><text x="365.0" y="300.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Controller</text><text x="365.0" y="320.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">event handlers</text></g><line x1="234" y1="304" x2="266" y2="304" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><text x="250" y="292" text-anchor="middle" fill="#9AA3B5" font-size="16" font-weight="500"></text><text x="250" y="364" text-anchor="middle" fill="#9AA3B5" font-size="16" font-weight="500"></text><path d="M365,262 C365,210 330,190 318,182" fill="none" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><text x="378" y="214" text-anchor="start" fill="#9AA3B5" font-size="13.5" font-weight="500">updates</text><path d="M186,182 C170,200 139,215 139,258" fill="none" stroke="#6FCF57" stroke-width="2.2" marker-end="url(#m-ok)"/><text x="126" y="214" text-anchor="end" fill="#6FCF57" font-size="13.5" font-weight="600">re-renders</text><text x="250" y="360" text-anchor="middle" fill="#9AA3B5" font-size="13.5" font-weight="500">user clicks</text><rect x="520" y="58" width="456" height="312" rx="16" fill="url(#zone)" stroke="#9B6BD6" stroke-width="1.5" stroke-dasharray="7 6"/><text x="536" y="82" text-anchor="start" fill="#F2EDE3" font-size="14.5" font-weight="700">On the server: Spring</text><g><g filter="url(#sh)"><rect x="540" y="170" width="128" height="104" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="540" y="170" width="128" height="5" rx="2.5" fill="#9B6BD6"/><text x="604.0" y="218.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Controller</text><text x="604.0" y="238.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">@RestController</text></g><g><g filter="url(#sh)"><rect x="684" y="170" width="128" height="104" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="684" y="170" width="128" height="5" rx="2.5" fill="#9B6BD6"/><text x="748.0" y="208.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">Model</text><text x="748.0" y="228.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">service +</text><text x="748.0" y="248.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">entity</text></g><g><g filter="url(#sh)"><rect x="828" y="170" width="128" height="104" rx="12" fill="#171E2E" stroke="#2C374E"/></g><rect x="828" y="170" width="128" height="5" rx="2.5" fill="#9B6BD6"/><text x="892.0" y="208.0" text-anchor="middle" fill="#F2EDE3" font-size="17" font-weight="700">View</text><text x="892.0" y="228.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">JSON</text><text x="892.0" y="248.0" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500" font-style="italic">response</text></g><line x1="668" y1="222" x2="680" y2="222" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><line x1="812" y1="222" x2="824" y2="222" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><path d="M460,318 C500,318 510,236 536,236" fill="none" stroke="#9B6BD6" stroke-width="2.2" marker-end="url(#m-acc)"/><text x="498" y="300" text-anchor="start" fill="#9AA3B5" font-size="13" font-weight="500">HTTP</text><path d="M892,170 C892,120 700,110 356,132" fill="none" stroke="#6FCF57" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#m-ok)"/><text x="700" y="152" text-anchor="middle" fill="#6FCF57" font-size="13.5" font-weight="600">JSON updates the model</text><text x="500.0" y="400" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500" font-style="italic">Keep what the user sees apart from the data and the rules: the screen changes most often.</text></svg>
