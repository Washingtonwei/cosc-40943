<title id="t">Two teams: integrate once at the end, or integrate every day</title>
<desc id="d">Team 1: four unhappy developers on month-long branches merge into main at once, and main explodes. Team 2: four happy developers on short branches merge every day; a small fire on main is put out with an extinguisher. Redrawn from the instructor's 2025 CI/CD deck.</desc>
