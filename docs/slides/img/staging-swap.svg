<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" font-family="'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">Deploy to staging, then swap</title>
<desc id="d">GitHub Actions deploys the new build to the staging slot while users keep using the old build in production. Each slot keeps its own database. When staging checks out, the two slots swap with no downtime; swapping again brings back the last known good build. Redrawn from the instructor's 2025 deck, after Microsoft's App Service documentation.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2EDE3"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5BE0E6"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB443"/></marker>
</defs>
<rect width="1000" height="380" rx="18" fill="#0F1420"/>
<text x="28" y="40" fill="#9B6BD6" font-size="15" font-weight="800" letter-spacing="2">DEPLOY TO STAGING, THEN SWAP</text><rect x="24.0" y="110.0" width="196" height="80" rx="12" fill="#1A2133" stroke="#5BE0E6" stroke-width="2.5"/><g fill="none" stroke="#5BE0E6" stroke-width="2.2"><circle cx="48.0" cy="136" r="9"/><path d="M45.0,131 L53.0,136 L45.0,141 z" fill="#5BE0E6"/><path d="M48.0,145 V162 H59.0"/><circle cx="67.0" cy="162" r="8"/><path d="M63.0,162 l3,3 l5,-6"/></g><text x="138" y="146" text-anchor="middle" fill="#F2EDE3" font-size="18" font-weight="600">GitHub Actions</text><text x="138" y="170" text-anchor="middle" fill="#9AA3B5" font-size="14" font-weight="500">new build</text><line x1="222" y1="150" x2="330" y2="150" stroke="#F2EDE3" stroke-width="3" marker-end="url(#ah)"/><text x="276" y="136" text-anchor="middle" fill="#F2EDE3" font-size="15" font-weight="700">deploy</text><path transform="translate(430,155) scale(1.05)" d="M-70,30 C-100,30 -100,-8 -72,-10 C-74,-40 -36,-52 -18,-30 C-8,-58 40,-58 46,-22 C76,-26 86,10 66,24 C62,28 58,30 52,30 Z" fill="#1A2133" stroke="#FFB443" stroke-width="2.5" stroke-linejoin="round"/><text x="426" y="150" text-anchor="middle" fill="#FFD08A" font-size="19" font-weight="800">Staging</text><text x="426" y="172" text-anchor="middle" fill="#F2EDE3" font-size="14" font-weight="500">new build</text><path transform="translate(700,155) scale(1.05)" d="M-70,30 C-100,30 -100,-8 -72,-10 C-74,-40 -36,-52 -18,-30 C-8,-58 40,-58 46,-22 C76,-26 86,10 66,24 C62,28 58,30 52,30 Z" fill="#1A2133" stroke="#5BE0E6" stroke-width="2.5" stroke-linejoin="round"/><text x="696" y="150" text-anchor="middle" fill="#5BE0E6" font-size="19" font-weight="800">Production</text><text x="696" y="172" text-anchor="middle" fill="#F2EDE3" font-size="14" font-weight="500">old build</text><path d="M500,100 C540,72 600,72 636,100" fill="none" stroke="#F2EDE3" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="568" y="68" text-anchor="middle" fill="#F2EDE3" font-size="18" font-weight="800">swap</text><g fill="none" stroke="#F2EDE3" stroke-width="2.3"><circle cx="882" cy="136" r="8"/><path d="M869,162 C869,148 895,148 895,162"/><circle cx="918" cy="136" r="8"/><path d="M905,162 C905,148 931,148 931,162"/><circle cx="900" cy="148" r="8"/><path d="M887,174 C887,160 913,160 913,174"/></g><g transform="translate(946,112)" fill="none" stroke="#5BE0E6" stroke-width="2.2" stroke-linecap="round"><circle r="13"/><circle cx="-4.5" cy="-3" r="1.4" fill="#5BE0E6"/><circle cx="4.5" cy="-3" r="1.4" fill="#5BE0E6"/><path d="M-6,3 Q0,9 6,3"/></g><line x1="870" y1="158" x2="794" y2="158" stroke="#F2EDE3" stroke-width="2.5" marker-end="url(#ah)"/><text x="900" y="206" text-anchor="middle" fill="#9AA3B5" font-size="15" font-weight="500">users</text><g fill="#1A2133" stroke="#FFD08A" stroke-width="2"><path d="M364,268 v40 a62,10 0 0 0 124,0 v-40"/><ellipse cx="426" cy="268" rx="62" ry="10"/></g><text x="426" y="298" text-anchor="middle" fill="#FFD08A" font-size="14" font-weight="700">staging DB</text><g fill="#1A2133" stroke="#5BE0E6" stroke-width="2"><path d="M634,268 v40 a62,10 0 0 0 124,0 v-40"/><ellipse cx="696" cy="268" rx="62" ry="10"/></g><text x="696" y="298" text-anchor="middle" fill="#5BE0E6" font-size="14" font-weight="700">production DB</text><line x1="426" y1="188" x2="426" y2="256" stroke="#FFD08A" stroke-width="2" stroke-dasharray="5 5"/><line x1="696" y1="188" x2="696" y2="256" stroke="#5BE0E6" stroke-width="2" stroke-dasharray="5 5"/><text x="561" y="252" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500">each slot keeps</text><text x="561" y="268" text-anchor="middle" fill="#9AA3B5" font-size="13" font-weight="500">its own database</text><text x="500" y="356" text-anchor="middle" fill="#9AA3B5" font-size="16" font-weight="500">Check staging, then swap: no downtime. Something wrong? Swap again: the last known good build is back.</text>
</svg>
